<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="../../style.css" />
    <link rel="stylesheet" href="./Dashboard.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.js"></script>
    <script defer src="../../common.js"></script>
    <script src="Dashboard.js" defer></script>
  </head>
  <body>
    <div class="app-container">
      <!-- SIDEBAR -->
      <aside class="sidebar">
        <div>
          <div class="sidebar-menu">
            <a href="./Dashboard.html"
              ><button class="active">
                <i class="fa-solid fa-chart-line" aria-hidden="true"></i>
                <span>Tổng quan</span>
              </button></a
            >
            <a href="../Product/Product.html"
              ><button>
                <i class="fa-solid fa-box" aria-hidden="true"></i>
                <span>Sản phẩm</span>
              </button></a
            >
            <a href="../Site/Site.html"
              ><button>
                <i class="fa-solid fa-globe" aria-hidden="true"></i>
                <span>Site</span>
              </button></a
            >
          </div>
        </div>
      </aside>

      <div class="main-wrapper">
        <header class="header">
          <div class="brand">
            <span class="brand-avatar">L</span>
            <span>Brand's Name</span>
          </div>
          <div class="header-user">
            <span id="user-email">Admin Lead</span>
            <div class="user-menu">
              <button class="avatar" type="button">A</button>
              <div class="user-dropdown">
                <button onclick="logout()">Đăng xuất</button>
              </div>
            </div>
          </div>
        </header>

        <main id="main-content">
          <div class="dashboard-grid">
            <!-- CỘT TRÁI: SẢN PHẨM VẬN HÀNH -->
            <div class="card card-left">
              <div class="card-header">
                <span class="card-title">SẢN PHẨM VẬN HÀNH</span>
              </div>

              <div class="stat-group">
                <h1 class="stat-number-main" id="total-products">0</h1>
                <div class="stat-subtext">
                  <p>
                    <strong id="total-active-products">0</strong> Đang hoạt động
                  </p>
                  <p class="text-muted">
                    <span id="total-inactive-products">0</span> Tạm ngưng
                  </p>
                </div>
              </div>

              <div class="progress-bar-container">
                <div
                  class="progress-bar-fill"
                  id="product-progress-bar"
                  style="width: 0%"
                ></div>
              </div>

              <div class="section-divider"></div>

              <div class="squad-section">
                <span class="section-subtitle">PHÂN BỐ KỸ THUẬT (SQUADS)</span>
                <div class="squad-list" id="squad-list"></div>
              </div>

              <a href="../Product/Product.html" class="link-action">
                Xem chi tiết danh mục sản phẩm
                <i class="fa-solid fa-arrow-right"></i>
              </a>

              <div class="chart-section">
                <div class="chart-header">
                  <span>ĐỘ ỔN ĐỊNH 7 NGÀY QUA</span>
                  <span class="text-highlight" id="stability-average">0% Avg</span>
                </div>
                <div class="chart-wrapper">
                  <canvas id="stabilityChart"></canvas>
                </div>
              </div>
            </div>

            <div class="card card-right">
              <div class="card-header">
                <div class="title-with-sync">
                  <span class="card-title"
                    >SITES GIÁM SÁT</span
                  >
                </div>
              </div>

              <div class="endpoint-main">
                <h1 class="stat-number-main" id="total-sites">0</h1>
                <span class="sync-text">Site</span>
              </div>

              <!-- Thanh trạng thái 3 phân đoạn -->
              <div class="multi-progress-container">
                <div class="multi-progress-bar">
                  <div
                    class="bar-segment segment-running"
                    style="width: 0%"
                  ></div>
                  <div
                    class="bar-segment segment-paused"
                    style="width: 0%"
                  ></div>
                  <div
                    class="bar-segment segment-stopped"
                    style="width: 0%"
                  ></div>
                </div>
                <div class="progress-labels">
                  <span>0%</span>
                  <span>50%</span>
                  <span>100%</span>
                </div>
              </div>

              <div class="status-grid">
                <div class="status-col">
                  <div class="status-header">
                    <i class="dot dot-cyan"></i> RUNNING
                  </div>
                  <div class="status-number" id="running-sites">0</div>
                  <div class="status-desc">
                    <span>Đang chạy ổn định</span>
                    <span class="status-percent" id="running-percent">0%</span>
                  </div>
                </div>

                <div class="status-col">
                  <div class="status-header">
                    <i class="dot dot-gray"></i> PAUSED
                  </div>
                  <div class="status-number" id="paused-sites">0</div>
                  <div class="status-desc">
                    <span>Tạm dừng</span>
                    <span class="status-percent" id="paused-percent">0%</span>
                  </div>
                </div>

                <div class="status-col">
                  <div class="status-header">
                    <i class="dot dot-red"></i> STOPPED
                  </div>
                  <div class="status-number text-red" id="stopped-sites">
                    0
                  </div>
                  <div class="status-desc">
                    <span>Sự cố</span>
                    <span class="status-percent text-red" id="stopped-percent">0%</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
