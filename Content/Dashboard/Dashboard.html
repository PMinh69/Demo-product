<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="../../style.css" />
    <link rel="stylesheet" href="./Dashboard.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.js"></script>
    <script src="Dashboard.js" defer></script>
  </head>
  <body>
    <div class="app-container">
      <!-- SIDEBAR -->
      <aside class="sidebar">
        <div>
          <div class="sidebar-header">Brand's Name</div>
          <div class="sidebar-menu">
            <a href="./Dashboard.html"
              ><button class="active">
                <i class="fa-solid fa-chart-line" aria-hidden="true"></i>
                <span>Tổng quan</span>
              </button></a
            >
            <a href="../Product/Product.html"
              ><button>
                <i class="fa-solid fa-box" aria-hidden="true"></i>
                <span>Sản phẩm</span>
              </button></a
            >
            <a href="../Site/Site.html"
              ><button>
                <i class="fa-solid fa-globe" aria-hidden="true"></i>
                <span>Site</span>
              </button></a
            >
          </div>
        </div>
      </aside>

      <div class="main-wrapper">
        <header class="header">
          <div class="header-user">
            <span id="user-email">Admin Lead</span>
            <div class="user-menu">
              <button class="avatar" type="button">A</button>
              <div class="user-dropdown">
                <button onclick="logout()">Dang xuat</button>
              </div>
            </div>
          </div>
        </header>

        <main id="main-content">
          <div class="dashboard-stats">
            <article class="stat-card stat-card-products">
              <div class="stat-icon"><i class="fa-solid fa-box"></i></div>
              <div class="stat-content">
                <span class="stat-label">Tổng sản phẩm</span>
                <strong class="stat-value" id="total-products">0</strong>
              </div>
            </article>

            <article class="stat-card stat-card-active">
              <div class="stat-icon">
                <i class="fa-solid fa-circle-check"></i>
              </div>
              <div class="stat-content">
                <span class="stat-label">Tổng Active</span>
                <strong class="stat-value" id="total-active-products">0</strong>
              </div>
            </article>

            <article class="stat-card stat-card-sites">
              <div class="stat-icon"><i class="fa-solid fa-globe"></i></div>
              <div class="stat-content">
                <span class="stat-label">Tổng Site</span>
                <strong class="stat-value" id="total-sites">0</strong>
              </div>
            </article>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
