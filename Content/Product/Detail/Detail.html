<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chi tiết sản phẩm</title>
    <link rel="stylesheet" href="../../../style.css" />
    <link rel="stylesheet" href="./Detail.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>
    <script defer src="../../../common.js"></script>
    <script defer src="../../../ipPublic.js"></script>
    <script defer src="./Detail.js"></script>
  </head>
  <body>
    <div class="app-container">
      <aside class="sidebar">
        <div>
          <div class="sidebar-menu">
            <a href="../../Dashboard/Dashboard.html"
              ><button>
                <i class="fa-solid fa-chart-line" aria-hidden="true"></i>
                <span>Tổng quan</span>
              </button></a
            >
            <a href="../Product.html"
              ><button class="active">
                <i class="fa-solid fa-box" aria-hidden="true"></i>
                <span>Sản phẩm</span>
              </button></a
            >
            <a href="../../Site/Site.html"
              ><button>
                <i class="fa-solid fa-globe" aria-hidden="true"></i>
                <span>Site</span>
              </button></a
            >
          </div>
        </div>
      </aside>

      <div class="main-wrapper">
        <header class="header">
          <div class="brand">
            <span class="brand-avatar">L</span>
            <span>Brand's Name</span>
          </div>
          <div class="header-user">
            <span id="user-email">Admin Lead</span>
            <div class="user-menu">
              <button class="avatar" type="button">A</button>
              <div class="user-dropdown">
                <button onclick="logout()">Dang xuat</button>
              </div>
            </div>
          </div>
        </header>

        <main id="main-content">
          <div class="site-heading">
            <a id="detail-back-link" href="../Product.html">
              <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
              <span>Quay lại</span>
            </a>
            <div class="site-actions">
              <button class="site-add-button" type="button" onclick="openSiteModal('add')">
                <i class="fa-solid fa-plus"></i>
                <span>Thêm site mới</span>
              </button>
              <button
                class="site-add-existing-button"
                type="button"
                onclick="openModal('addExistedModal')"
              >
                <i class="fa-solid fa-link" aria-hidden="true"></i>
                <span>Thêm site</span>
              </button>
            </div>
          </div>
          <section id="product-info"></section>

          <div class="site-filter-card">
            <div class="site-search">
              <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
              <input
                type="search"
                id="site-search"
                placeholder="Tìm kiếm site..."
                oninput="RenderFilter()"
              />
            </div>
            <div class="site-selects">
              <select id="filter-ip" onchange="RenderFilter()">
                <option value="">IP Server</option>
              </select>
              <select id="filter-type" onchange="RenderFilter()">
                <option value="">Loại</option>
                <option value="1">Website</option>
                <option value="2">WebAPI</option>
                <option value="3">WindowsService</option>
                <option value="4">WorkerService</option>
                <option value="5">DesktopApp</option>
                <option value="6">MobileApp</option>
              </select>
              <select id="filter-status" onchange="RenderFilter()">
                <option value="">Trạng thái</option>
                <option value="1">Run</option>
                <option value="0">Pause</option>
                <option value="-1">Stop</option>
              </select>
            </div>
          </div>

          <div class="table-container">
            <table class="site-table">
              <thead>
                <tr>
                  <th>Tên ứng dụng</th>
                  <th>URL Site</th>
                  <th>IP Server</th>
                  <th>Ghi chú</th>
                  <th>Loại</th>
                  <th>Trạng thái</th>
                  <th>IP Server nội bộ</th>
                  <th>Đường dẫn thư mục</th>
                  <th>Thao tác</th>
                </tr>
              </thead>
              <tbody id="site-body"></tbody>
            </table>
          </div>
        </main>
      </div>
    </div>

    <!-- Add existed site modal -->
    <div id="addExistedModal" class="modal-overlay" style="display: none">
      <div class="add-existed-modal">
        <button class="close-btn" onclick="closeModal('addExistedModal')">
          &times;
        </button>
        <div class="existed-site-toolbar">
          <div class="form-group existed-site-search">
            <input
              type="text"
              id="searchExistedSite"
              placeholder="Tìm kiếm theo tên ứng dụng, URL hoặc IP..."
              oninput="RenderFilter()"
            />
          </div>
          <div class="existed-site-selects">
            <select id="existed-filter-ip" onchange="RenderFilter()">
              <option value="">IP Server</option>
            </select>
            <select id="existed-filter-type" onchange="RenderFilter()">
              <option value="">Loại</option>
              <option value="1">Website</option>
              <option value="2">WebAPI</option>
              <option value="3">WindowsService</option>
              <option value="4">WorkerService</option>
              <option value="5">DesktopApp</option>
              <option value="6">MobileApp</option>
            </select>
            <select id="existed-filter-status" onchange="RenderFilter()">
              <option value="">Trạng thái</option>
              <option value="1">Run</option>
              <option value="0">Pause</option>
              <option value="-1">Stop</option>
            </select>
          </div>
        </div>
        <div
          class="table-container"
          style="max-height: 500px; border-radius: 4px"
        >
          <table class="site-table">
            <thead>
              <tr>
                <th style="width: 40px; text-align: center">
                  <div class="checkbox-wrapper-40">
                    <label>
                      <input
                        type="checkbox"
                        id="selectAllExistedSites"
                        class="checkbox-control"
                        onclick="toggleSelectAllExisted(this)"
                        aria-label="Chọn tất cả site"
                      />
                      <span class="checkbox"></span>
                    </label>
                  </div>
                </th>
                <th>Tên ứng dụng</th>
                <th>URL Site</th>
                <th>IP Public</th>
                <th>Loại</th>
                <th>Trạng thái</th>
                <th>IP Local</th>
                <th>Đường dẫn thư mục</th>
              </tr>
            </thead>
            <tbody id="existed-site-body"></tbody>
          </table>
        </div>
        <div class="form-actions" style="margin-top: 20px">
          <button
            type="button"
            class="btn-cancel"
            onclick="closeModal('addExistedModal')"
          >
            Hủy bỏ
          </button>
          <button type="button" class="btn-submit" onclick="addExistedSites()">
            Thêm các site đã chọn
          </button>
        </div>
      </div>
    </div>

    <!-- Add/update site modal -->
    <div id="siteModal" class="modal-overlay" style="display: none">
      <div class="add-modal">
        <button class="close-btn" type="button" onclick="closeModal('siteModal')">
          &times;
        </button>
        <h2 id="site-modal-title">Thêm Site</h2>
        <form id="siteForm" onsubmit="submitSiteModal(event)">
          <input type="hidden" id="site_id" name="site_id" />
          <div class="form-group">
            <label for="application_name">Tên Ứng Dụng *</label>
            <input
              type="text"
              id="application_name"
              name="application_name"
              placeholder="VD: PMR test..."
              required
            />
          </div>
          <div class="form-group">
            <label for="url_site">URL site</label>
            <input
              type="text"
              id="url_site"
              name="url_site"
              placeholder="VD: https://pmr.testing.com"
            />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>IP Public</label>
              <div class="public-ip-editor">
                <div id="ip_server_list" class="public-ip-list"></div>
                <button
                  type="button"
                  id="public-ip-toggle"
                  class="public-ip-add-button"
                  onclick="togglePublicIpOptions()"
                  aria-label="Thêm IP public"
                  aria-expanded="false"
                  aria-controls="ip_server_options"
                  title="Thêm IP"
                >
                  <i class="fa-solid fa-plus" aria-hidden="true"></i>
                </button>
                <div
                  id="ip_server_options"
                  class="public-ip-options"
                  hidden
                ></div>
              </div>
            </div>
            <div class="form-group">
              <label for="ip_server_local">IP Server Local</label>
              <input
                type="text"
                id="ip_server_local"
                name="ip_server_local"
                placeholder="VD: 192.168.1.161"
              />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="type">Loại Site</label>
              <select id="type" name="type">
                <option value="" disabled selected hidden>
                  -- Chọn loại site --
                </option>
                <option value="1">Website</option>
                <option value="2">WebAPI</option>
                <option value="3">WindowsService</option>
                <option value="4">WorkerService</option>
                <option value="5">DesktopApp</option>
                <option value="6">MobileApp</option>
              </select>
            </div>
            <div class="form-group">
              <label for="status">Trạng Thái</label>
              <select id="status" name="status">
                <option value="" disabled selected hidden>
                  -- Chọn trạng thái --
                </option>
                <option value="-1">Stop</option>
                <option value="0">Pause</option>
                <option value="1">Run</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label for="folder_path">Đường dẫn thư mục</label>
            <input
              type="text"
              id="folder_path"
              name="folder_path"
              placeholder="/var/www/html/..."
            />
          </div>
          <div class="form-group">
            <label for="note">Ghi chú</label>
            <textarea
              id="note"
              name="note"
              rows="3"
              placeholder="VD: Đã cập nhật IP"
            ></textarea>
          </div>
          <div class="form-actions">
            <button
              type="button"
              class="btn-cancel"
              onclick="closeModal('siteModal')"
            >
              Hủy bỏ
            </button>
            <button type="submit" class="btn-submit">
              Lưu thay đổi
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Delete site modal -->
    <div id="deleteSiteModal" class="modal-overlay" style="display: none">
      <div class="delete-modal" role="dialog" aria-modal="true" aria-labelledby="delete-site-title">
        <div class="delete-modal-icon">
          <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
        </div>
        <h2 id="delete-site-title">Xóa site khỏi sản phẩm?</h2>
        <p>Bạn có chắc chắn muốn xóa liên kết site này không?</p>
        <div class="delete-modal-actions">
          <button type="button" class="delete-modal-cancel" onclick="cancelDeleteSite()">
            Hủy bỏ
          </button>
          <button type="button" class="delete-modal-confirm" onclick="confirmDeleteSite()">
            Xóa
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
