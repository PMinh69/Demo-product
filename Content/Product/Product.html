<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sản phẩm</title>
    <link rel="stylesheet" href="../../style.css" />
    <link rel="stylesheet" href="Product.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>
    <script defer src="./Product.js"></script>
  </head>
  <body>
    <div class="app-container">
      <aside class="sidebar">
        <div>
          <div class="sidebar-header">Brand's Name</div>
          <div class="sidebar-menu">
            <a href="../Dashboard/Dashboard.html"
              ><button>
                <i class="fa-solid fa-chart-line" aria-hidden="true"></i>
                <span>Tổng quan</span>
              </button></a
            >
            <a href="./Product.html"
              ><button class="active">
                <i class="fa-solid fa-database" aria-hidden="true"></i>
                <span>Sản phẩm</span>
              </button></a
            >
            <a href="../Site/Site.html"
              ><button>
                <i class="fa-solid fa-globe" aria-hidden="true"></i>
                <span>Site</span>
              </button></a
            >
          </div>
        </div>
      </aside>

      <div class="main-wrapper">
        <header class="header">
          <div class="header-user">
            <span id="user-email">Admin Lead</span>
            <div class="user-menu">
              <button class="avatar" type="button">A</button>
              <div class="user-dropdown">
                <button onclick="logout()">Dang xuat</button>
              </div>
            </div>
          </div>
        </header>

        <main id="main-content">
          <div class="product-actions">
            <button
              class="product-action product-action-add"
              type="button"
              onclick="openModal('addProductModal')"
            >
              <i class="fa-solid fa-plus" aria-hidden="true"></i>
              <span>Thêm sản phẩm</span>
            </button>
          </div>
          <div class="product-filter-card">
            <div class="product-search">
              <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
              <input
                type="search"
                id="product-search"
                placeholder="Tìm kiếm sản phẩm..."
                oninput="RenderFilter()"
              />
            </div>
            <div class="product-selects">
              <select id="filter-team" onchange="RenderFilter()">
                <option value="">Đội phụ trách</option>
                <option value="team1">Team 1</option>
                <option value="team2">Team 2</option>
                <option value="team3">Team 3</option>
                <option value="team4">Team 4</option>
                <option value="mscscrum">Mscscrum</option>
              </select>
              <select id="filter-status" onchange="RenderFilter()">
                <option value="">Trạng thái</option>
                <option value="true">Active</option>
                <option value="false">Inactive</option>
              </select>
              <select id="filter-environment" onchange="RenderFilter()">
                <option value="">Môi trường</option>
                <option value="0">Test</option>
                <option value="1">Test UAT</option>
                <option value="2">Product</option>
              </select>
            </div>
          </div>
          <div class="table-container">
            <table class="product-table">
              <thead>
                <tr>
                  <th>tên dự án</th>
                  <th>mô tả</th>
                  <th>đội phụ trách</th>
                  <th>đối tác</th>
                  <th>main server</th>
                  <th>môi trường</th>
                  <th>trạng thái</th>
                  <th>thao tác</th>
                </tr>
              </thead>
              <tbody id="product-body"></tbody>
            </table>
          </div>
        </main>
      </div>
    </div>

    <!-- Add modal -->
    <div id="addProductModal" class="modal-overlay" style="display: none">
      <div class="add-modal">
        <form id="productForm">
          <div class="add-modal-header">
            <h2>Thêm sản phẩm</h2>
          </div>
          <div class="form-group">
            <label for="product_name">Tên Product *</label>
            <input
              type="text"
              id="product_name"
              name="name"
              placeholder="VD: Hệ thống thanh toán..."
              required
            />
          </div>

          <div class="form-row product-info-row">
            <div class="form-group">
              <label for="partner_name">Tên Đối Tác</label>
              <input
                type="text"
                id="partner_name"
                name="partner_name"
                placeholder="VD: Viettel, VNPT..."
              />
            </div>

            <div class="form-group">
              <label for="project_name">Tên Dự Án</label>
              <input
                type="text"
                id="project_name"
                name="project_name"
                placeholder="E-Commerce Platform"
              />
            </div>

            <div class="form-group">
              <label for="project_code">Mã Dự Án</label>
              <input
                type="text"
                id="project_code"
                name="project_code"
                placeholder="PRJ-001"
              />
            </div>
          </div>

          <div class="form-row product-team-row">
            <div class="form-group">
              <label for="team_code">Đội phụ trách</label>
              <select id="team_code" name="team_code">
                <option value="">-- Chọn đội --</option>
                <option value="team1">Team 1</option>
                <option value="team2">Team 2</option>
                <option value="team3">Team 3</option>
                <option value="team4">Team 4</option>
                <option value="mscscrum">Mscscrum</option>
              </select>
            </div>
            <div class="form-group">
              <label for="environment_type">Loại Môi Trường</label>
              <select id="environment_type" name="environment_type">
                <option value="" disabled selected hidden>
                  -- Chọn môi trường --
                </option>
                <option value="0">Test</option>
                <option value="1">Test UAT</option>
                <option value="2">Product</option>
              </select>
            </div>
          </div>

          <div class="form-row product-server-row">
            <div class="form-group">
              <label for="main_server">Server</label>
              <input
                type="text"
                id="main_server"
                name="main_server"
                placeholder="VD: 103.142.26.45 hoặc sv-prod-01"
              />
            </div>
            <div class="form-group">
              <label>Trạng thái</label>

              <div class="status-control">
                <span class="status-text" id="productStatusText">
                  <span class="status-text-unchecked">INACTIVE</span>
                  <span class="status-text-checked">ACTIVE</span>
                </span>

                <div class="checkbox-wrapper-35">
                  <input
                    class="switch"
                    type="checkbox"
                    id="is_live"
                    name="is_live"
                  />
                  <label for="is_live" class="status-switch-label">
                    <span class="switch-track" aria-hidden="true"></span>
                  </label>
                </div>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label for="product_description">Mô tả</label>
            <textarea
              id="product_description"
              name="description"
              rows="3"
              placeholder="VD: Mô tả chi tiết về sản phẩm..."
            ></textarea>
          </div>

          <div class="form-actions">
            <button
              type="button"
              class="btn-cancel"
              onclick="closeModal('addProductModal')"
            >
              Hủy bỏ
            </button>

            <button type="button" class="btn-submit" onclick="addProduct()">
              Lưu thay đổi
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Update Modal -->
    <div id="updateProductModal" class="modal-overlay" style="display: none">
      <div class="add-modal">
        <form id="updateProductForm">
          <input type="hidden" id="update_product_id" />
          <div class="add-modal-header">
            <h2>Cập nhật sản phẩm</h2>
          </div>
          <div class="form-group">
            <label for="update_product_name">Tên Product *</label>
            <input
              type="text"
              id="update_product_name"
              name="name"
              placeholder="VD: Hệ thống thanh toán..."
              required
            />
          </div>

          <div class="form-row product-info-row">
            <div class="form-group">
              <label for="update_partner_name">Tên Đối Tác</label>
              <input
                type="text"
                id="update_partner_name"
                name="partner_name"
                placeholder="VD: Viettel, VNPT..."
              />
            </div>

            <div class="form-group">
              <label for="update_project_name">Tên Dự Án</label>
              <input
                type="text"
                id="update_project_name"
                name="project_name"
                placeholder="E-Commerce Platform"
              />
            </div>

            <div class="form-group">
              <label for="update_project_code">Mã Dự Án</label>
              <input
                type="text"
                id="update_project_code"
                name="project_code"
                placeholder="PRJ-001"
              />
            </div>
          </div>

          <div class="form-row product-team-row">
            <div class="form-group">
              <label for="update_team_code">Đội phụ trách</label>
              <select id="update_team_code" name="team_code">
                <option value="">-- Chọn đội --</option>
                <option value="team1">Team 1</option>
                <option value="team2">Team 2</option>
                <option value="team3">Team 3</option>
                <option value="team4">Team 4</option>
                <option value="mscscrum">Mscscrum</option>
              </select>
            </div>
            <div class="form-group">
              <label for="update_environment_type">Loại Môi Trường</label>
              <select id="update_environment_type" name="environment_type">
                <option value="" disabled selected hidden>
                  -- Chọn môi trường --
                </option>
                <option value="0">Test</option>
                <option value="1">Test UAT</option>
                <option value="2">Product</option>
              </select>
            </div>
          </div>

          <div class="form-row product-server-row">
            <div class="form-group">
              <label for="update_main_server">Server</label>
              <input
                type="text"
                id="update_main_server"
                name="main_server"
                placeholder="VD: 103.142.26.45 hoặc sv-prod-01"
              />
            </div>
            <div class="form-group">
              <label>Trạng thái</label>
              <div class="status-control">
                <span class="status-text" id="updateProductStatusText">
                  <span class="status-text-unchecked">INACTIVE</span>
                  <span class="status-text-checked">ACTIVE</span>
                </span>

                <div class="checkbox-wrapper-35">
                  <input
                    class="switch"
                    type="checkbox"
                    id="update_is_live"
                    name="is_live"
                  />
                  <label for="update_is_live" class="status-switch-label">
                    <span class="switch-track" aria-hidden="true"></span>
                  </label>
                </div>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label for="update_product_description">Mô tả</label>
            <textarea
              id="update_product_description"
              name="description"
              rows="3"
              placeholder="VD: Mô tả chi tiết về sản phẩm..."
            ></textarea>
          </div>

          <div class="form-actions">
            <button
              type="button"
              class="btn-cancel"
              onclick="closeModal('updateProductModal')"
            >
              Hủy bỏ
            </button>

            <button type="button" class="btn-submit" onclick="updateProduct()">
              Lưu thay đổi
            </button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
